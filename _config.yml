# Site settings. Jekyll does not reload this file while `jekyll serve` is running;
# restart the server after editing it.

title                    : "Lin Ai"
description              : "Lin Ai — M.S. student in Computational Linguistics at Georgetown University."
repository               : "linnotlinn/linnotlinn.github.io"

# Google Analytics (optional): https://analytics.google.com/analytics/
google_analytics_id      :

# Search engine verification (optional; Google is verified via google32cfa61545c89b34.html)
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Profile shown in the sidebar
author:
  name             : "Lin Ai"
  name_native      :   # e.g. Chinese name, shown next to the name
  avatar           : "images/avatar.jpg"
  position         : "M.S. Student, Computational Linguistics"
  bio              : "Georgetown University"
  interests        : ["Interpretability", "Language models", "LM evaluation", "Computational linguistics"]
  location         : "Washington D.C., USA"
  email            : "la987@georgetown.edu"
  googlescholar    : "https://scholar.google.com/citations?user=As7tFbsAAAAJ&hl=en"
  github           : "linnotlinn"
  twitter          : "linnotlinn_"
  linkedin         : "lin-ai-817a20205"
  cv               :   # path or URL to a CV PDF, e.g. "files/cv.pdf"


# Build
include:
  - _pages
  - files
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run_server.sh
  - .sass-cache
  - .jekyll-cache
  - vendor

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  style: compressed

permalink: /:categories/:title/
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
